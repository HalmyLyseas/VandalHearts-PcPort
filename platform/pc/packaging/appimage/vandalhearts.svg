<?xml version="1.0" encoding="UTF-8"?>
<!-- Original placeholder icon for the Vandal Hearts PC port. Deliberately NOT game art
     (Konami sprites/logo are copyrighted); a plain "VH" monogram on a shield so the
     public repo ships something original. Swap for real branding later if desired. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1c1c"/>
      <stop offset="1" stop-color="#1a0d0d"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e2d0"/>
      <stop offset="1" stop-color="#9a9484"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="40" fill="url(#bg)"/>
  <!-- shield -->
  <path d="M128 32 L206 60 V132 C206 176 170 208 128 224 C86 208 50 176 50 132 V60 Z"
        fill="none" stroke="#6b2f2f" stroke-width="8"/>
  <!-- crossed-swords hint -->
  <path d="M78 78 L178 178 M178 78 L78 178" stroke="#5a2626" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  <!-- VH monogram -->
  <text x="128" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="96" font-weight="700" fill="url(#steel)"
        style="letter-spacing:-6px">VH</text>
</svg>

; Vandal Hearts - PC port configuration
; ---------------------------------------------------------------------------------------------

; Edit this file instead of setting environment variables. Place it next to the game executable
; (Windows/native Linux), or for the Linux AppImage, next to the .AppImage file itself.

; Uncomment a line (remove the leading ';') and set its value -- anything left commented keeps
; the built-in default. A real env var of the same name always overrides this file. Section
; headers below are just for readability; the key names are what matter.

[game]
; Path to your disc image (raw .bin) -- USA (SLUS-00447), Asia (SCPS-45183) or Japan (SLPM-86007).
; Leave commented to auto-detect a *.bin in a "game" folder, or sitting directly beside the exe.
;VH_DISC_IMAGE=game/Vandal Hearts (USA).bin

; Which game to run when discs for BOTH regions are present: auto (default, prefers USA/Asia),
; us, or jp. With a single disc present the region always follows the disc.
;VH_REGION=auto

[video]
; Window scale (1-8, default 2): integer multiplier of the native 320x240. Also settable
; live in the in-game options overlay (SELECT + START), which writes the choice back here.
;VH_SCALE=2

; Start in fullscreen-desktop (1) vs windowed (0, default); aspect is preserved (letterboxed).
; Also toggleable in the options overlay.
;VH_FULLSCREEN=0

; PSX-accurate software rasterizer (default ON): reproduces the real PS1 GPU's texture
; sampling, dithering and blending. See platform/pc/OPTIONS.md, "Everyday options".
;VH_ACCURATE=0

; Internal render resolution: supersample the 3D at 2x-4x native for a sharper image with
; no change to art or camera (1x = off, default). See platform/pc/OPTIONS.md, "Everyday options".
;VH_INTERNAL_SCALE=1

; Worker threads for the internal-resolution rasterizer (default: automatic, one per CPU
; core). See platform/pc/OPTIONS.md, "Everyday options".
;VH_RASTER_THREADS=4

[camera]
; Invert the right-stick camera axes (0 = normal, 1 = inverted); Y ships inverted by
; default (the modern twin-stick convention -- push up tilts the view down).
;VH_CAM_INVERT_X=0     ; horizontal (rotate direction)
VH_CAM_INVERT_Y=1     ; vertical (raise/lower angle)

[compatibility]
; Make hardware timer RCnt1 frame-relative (1) -- a workaround for very low frame rates (e.g. under
; a sanitizer build). Off by default; not needed at normal speed.
;VH_RCNT1_NORMALIZE=0

[audio]
; The software SPU is calibrated to real-hardware output; there are no user tuning knobs
; here. The keys below are experiment/debug only -- they mute parts of the mix, they
; don't change fidelity. See platform/pc/OPTIONS.md, "Everyday options".

;VH_SEQ_MUTE=0          ; 1 = mute the SEQ (sequenced) music, leaving SFX
;VH_SPU_SOLOPROG=-1     ; solo a single VAB program index (debug), -1 = off
;VH_SPU_MUTEPROG=-1     ; mute a single VAB program index (debug), -1 = off

[debug]
; Diagnostic logs / overlays -- ALL OFF by default. Set to 1 to enable; logs are written
; next to the executable. For end users there is no reason to touch these.

;VH_UI_LOG=1            ; UI/window compositing trace (vh_ui_log.txt)
;VH_SEQ_LOG=1           ; SEQ sequencer trace (vh_seq_log.txt)
;VH_SFX_LOG=1           ; SFX key-on/off trace (vh_sfx_log.txt)

;VH_CAM_LOG=1           ; per-frame camera-target watch (vh_camera_target_full_watch_log_pc.csv)
;VH_RAND_LOG=1          ; per-frame RNG-seed watch (vh_rand_seed_full_watch_log_pc.csv)
;VH_CAM_OSD=1           ; on-screen camera position overlay

;VH_FPS_LOG=1           ; per-second [FPS] meter on the console (off: it floods bug-report logs)
;VH_AI_LOG=1            ; AI targeting/decision logs (vh_ai_*.csv/txt, vh_ai_chain_pc.csv)
;VH_MTX_LOG=1           ; camera-matrix / OTZ baseline (vh_camera_matrix_otz_pc.csv)

;VH_TERRAIN_LOG=1       ; terrain OTZ log (vh_terrain_otz_pc.csv)
;VH_TERRAINPROJ_LOG=1   ; terrain projection log (vh_terrain_proj.csv)
;VH_OBJPRIM4_LOG=1      ; AddObjPrim4 sprite log (vh_objprim4.csv)

;VH_SPRITE_LOG=1        ; sprite-fate / event-entity logs (vh_sprite_fate.csv, vh_evt_entity.csv)
;VH_SPRITE_QUAD_LOG=1   ; sprite-quad log (vh_sprite_quad.csv)
;VH_AUDIO_LOG=1         ; audio-command log (vh_audio_cmd.csv)

;VH_XA_LOG=1            ; CD-XA streaming log (vh_xa_log.txt)
;VH_XA_CSV=1            ; CD-XA per-sector CSV (vh_xa_ours.csv)
;VH_SPU_TRACE=1         ; SPU voice trace

;VH_SPU_DUMPVAG=1       ; dump decoded VAG samples to .wav
